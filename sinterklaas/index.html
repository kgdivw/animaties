<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maanlicht op het plein — Sinterklaas</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#05060f; overflow:hidden; }
  body{ font-family:"Inter","Segoe UI",system-ui,sans-serif; color:#f6ead8; -webkit-font-smoothing:antialiased; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:4;
    display:flex; align-items:center; gap:14px; padding:8px 14px; border-radius:999px;
    background:rgba(30,12,20,.5); border:1px solid rgba(255,220,170,.16);
    backdrop-filter:blur(12px) saturate(140%); box-shadow:0 10px 40px rgba(0,0,0,.45);
    opacity:.18; transition:opacity .45s ease;
  }
  .ui:hover, body:hover .ui{ opacity:1; }
  .ui button{
    appearance:none; border:0; cursor:pointer; width:34px; height:34px; border-radius:50%;
    background:rgba(255,230,190,.09); color:#fbecd6; font-size:14px; line-height:1;
    display:grid; place-items:center; transition:background .2s ease, transform .2s ease;
  }
  .ui button:hover{ background:rgba(255,230,190,.22); transform:translateY(-1px); }
  .ui button.wide{ width:auto; padding:0 12px; border-radius:999px; font-size:12px; letter-spacing:.06em; }
  .track{ position:relative; width:280px; height:4px; border-radius:999px; background:rgba(255,230,200,.18); cursor:pointer; }
  .track::after{ content:""; position:absolute; inset:-10px 0; }
  .bar{ height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#c8202a,#f2b632); box-shadow:0 0 12px rgba(255,180,90,.5); }
  @media (max-width:680px){ .ui{ gap:8px; padding:6px 10px; bottom:16px; } .track{ width:120px; } }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="ui">
    <button id="play" title="Pauze / spelen (spatie)">❚❚</button>
    <button id="restart" title="Opnieuw (R)">↺</button>
    <div class="track" id="track"><div class="bar" id="bar"></div></div>
    <button id="speed" class="wide" title="Snelheid">1×</button>
    <button id="ref" class="wide" title="Template vergelijken (O): uit → 50% → helft → volledig">ref</button>
    <button id="turn" class="wide" title="Personages los bekijken (C)">3D</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="models/chars_glb.js?v=16"></script>
  <script src="core.js?v=16"></script>
  <script src="sprite.js?v=16"></script>
  <script src="chars3d.js?v=16"></script>
  <script src="poses.js?v=16"></script>
  <script src="puppet3d.js?v=16"></script>
  <script src="characters.js?v=16"></script>
  <script src="town.js?v=16"></script>
  <script src="anim.js?v=16"></script>
</body>
</html>
