<style>

<div id="start">▶ Waterpark: Sunrise Fever<small>klik om te starten · spatie = pauze · ←/→ = maat terug/vooruit · 1–8 = sectie · H = HUD · [ ] = beat-offset</small></div>
<audio id="music" src="Sunrise_Fever.mp3" preload="auto"></audio>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
const V = THREE.Vector3, UP = new V(0, 1, 0);

/* ====================================================================
   TIJD — alles is een pure functie van de absolute muziektijd t.
   Geen dt-integratie: een trage frame slaat over, loopt nooit achter.
   ==================================================================== */
const BPM = 145, SPB = 60 / BPM, BAR = SPB * 4;
let OFF = 0.06;                               // seconde waarop maat 0 tel 1 valt
const SECS = [
  ['Intro: Jungle Sunrise', 0, 8, 'intro'], ['Verse (Sitar)', 8, 24, 'verse'],
  ['Build-Up (Taiko!)', 24, 32, 'build'], ['DROP! (Steel Drums)', 32, 48, 'drop'],
  ['Euphoria (Pan Flute)', 48, 64, 'break'], ['Build-Up 2', 64, 72, 'build'],
  ['FINAL DROP (Bagpipe Madness)', 72, 88, 'drop2'], ['Outro', 88, 96, 'outro']];
const secAt = b => SECS.find(s => b < s[2]) || SECS[SECS.length - 1];

const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const smooth = u => (u = clamp(u), u * u * (3 - 2 * u));
const lerp = (a, c, u) => a + (c - a) * u;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// welke tellen hebben een kick (afgeleid van sunrise_fever.py)
function hasKick(beat) {
  if (beat < 0) return false;
  const bar = Math.floor(beat / 4), q = beat % 4, s = secAt(bar), i = bar - s[1];
  switch (s[3]) {
    case 'intro': return i >= 4;
    case 'verse': case 'drop': case 'drop2': return true;
    case 'build': return i < 6;
    case 'break': return i >= 12 && (q === 0 || q === 2);
    case 'outro': return i < 6 || (i === 7 && q === 0);
  }
  return false;
}
function kickEnv(b) {                          // scherpe puls op elke kick
  const bt = Math.floor(b * 4); if (!hasKick(bt)) return 0;
  return Math.exp(-(b * 4 - bt) * SPB * 9);
}
function hop(b) {                              // sprongetje dat óp de tel landt
  const bt = Math.floor(b * 4); if (!hasKick(bt + 1)) return 0;
  const f = b * 4 - bt; return 4 * f * (1 - f);
}
function energy(b) {
  const s = secAt(b), i = b - s[1];
  return { intro: lerp(.3, .55, i / 8), verse: .5 + (i >= 8 ? .15 : 0), build: lerp(.5, 1, i / 8),
           drop: 1, break: .2, drop2: 1.3, outro: lerp(.7, .1, i / 8) }[s[3]];
}
function buildShake(b) {                       // snare-roll intensiteit
  const s = secAt(b); if (s[3] !== 'build') return 0;
  const i = b - s[1]; if (i >= 7.5) return 0;
  const rate = i < 2 ? 1 : i < 4 ? 2 : 4;
  const f = (b * 4 * rate) % 1;
  return (0.03 + 0.22 * (i / 7.5) ** 2) * (0.5 + 0.5 * Math.exp(-f * 4));
}
const crashBars = [8, 32, 40, 48, 72, 76, 80, 84, 95];

/* ==================================================================== RENDER */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe6ff, 120, 380);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 1000);
// ?render=1 -> vaste 1920x1080 buffer voor de video-export
const RENDER = new URLSearchParams(location.search).has('render'), VW = 1920, VH = 1080;
function resize() {
  if (RENDER) { renderer.setPixelRatio(1); renderer.setSize(VW, VH, false); camera.aspect = VW / VH; }
  else { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; }
  camera.updateProjectionMatrix();
}
if (RENDER) Object.assign(renderer.domElement.style, { width: '100vw', height: 'auto' });
addEventListener('resize', resize); resize();

const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .7 }, o));
const add = (m, x = 0, y = 0, z = 0, cast = true) => { m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; scene.add(m); return m; };

/* ---- lucht */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, bot: { value: new THREE.Color() }, sunDir: { value: new V() }, sunCol: { value: new THREE.Color() } },
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top,bot,sunCol,sunDir; varying vec3 vP;
    void main(){ vec3 d = normalize(vP); float h = clamp(d.y*1.6+0.08,0.,1.);
      vec3 c = mix(bot, top, pow(h,.6)); float s = max(dot(d, normalize(sunDir)),0.);
      c += sunCol*(pow(s,900.)*6. + pow(s,14.)*.45);
      gl_FragColor = vec4(c,1.);
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), skyMat); scene.add(sky);
const SKY = [ // maat, top, horizon, zonhoogte
  [0, '#141844', '#ff6a3a', -0.06], [5, '#2d5aa8', '#ffb070', 0.12], [10, '#3d8fe0', '#c4e8ff', 0.55],
  [46, '#3d8fe0', '#c4e8ff', 0.7], [50, '#4f78c0', '#ffcf8a', 0.28], [62, '#4f78c0', '#ffcf8a', 0.26],
  [66, '#3d8fe0', '#c4e8ff', 0.6], [87, '#3d8fe0', '#c4e8ff', 0.55], [92, '#4b3a7a', '#ff8048', 0.08], [97, '#141032', '#ff4a30', -0.02]];
const SKYC = SKY.map(k => [k[0], new THREE.Color(k[1]), new THREE.Color(k[2]), k[3]]);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 300 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.06;   // geen strepen (shadow acne) op de gebogen platen
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfe6ff, 0x8a7a5a, 0.8); scene.add(hemi);
const tmpC = new THREE.Color();
function updateSky(b) {
  let k = 0; while (k < SKYC.length - 2 && b > SKYC[k + 1][0]) k++;
  const A = SKYC[k], B = SKYC[k + 1], u = smooth((b - A[0]) / (B[0] - A[0]));
  skyMat.uniforms.top.value.copy(A[1]).lerp(B[1], u);
  skyMat.uniforms.bot.value.copy(A[2]).lerp(B[2], u);
  const el = lerp(A[3], B[3], u);
  const dir = new V(-0.45, el, -1).normalize();
  skyMat.uniforms.sunDir.value.copy(dir);
  const warm = 1 - smooth((el - 0.05) / 0.4);
  skyMat.uniforms.sunCol.value.setRGB(1, lerp(.95, .55, warm), lerp(.85, .3, warm));
  scene.fog.color.copy(skyMat.uniforms.bot.value);
  const ld = new V(-0.45, Math.max(el, 0.1), -1).normalize();
  sun.position.copy(ld).multiplyScalar(150); sun.target.position.set(0, 0, 0);
  sun.color.setRGB(1, lerp(.97, .62, warm), lerp(.92, .4, warm));
  sun.intensity = 0.25 + 2.6 * smooth((el + 0.05) / 0.4);
  hemi.intensity = 0.35 + 0.6 * smooth((el + 0.05) / 0.5);
  hemi.color.copy(skyMat.uniforms.top.value).lerp(new THREE.Color(1, 1, 1), .4);
}

/* ---- terrein */
add(new THREE.Mesh(new THREE.CircleGeometry(600, 64).rotateX(-Math.PI / 2), std('#6fbf5a')), 0, -0.02, 0, false);
add(new THREE.Mesh(new THREE.CircleGeometry(49, 96).rotateX(-Math.PI / 2), std('#ecdcbc')), 0, 0, 0, false);
const waterMat = std('#2fc4e6', { roughness: .08, metalness: .1, transparent: true, opacity: .88 });
add(new THREE.Mesh(new THREE.RingGeometry(49, 55, 160).rotateX(-Math.PI / 2), waterMat), 0, 0.03, 0, false);
add(new THREE.Mesh(new THREE.RingGeometry(55, 56.2, 160).rotateX(-Math.PI / 2), std('#f4f1ea')), 0, 0.05, 0, false);
const coping = std('#f7f5ef');
function pool(x, z, w, d) {
  add(new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), waterMat), x, 0.04, z, false);
  const t = 0.6;
  add(new THREE.Mesh(new THREE.BoxGeometry(w + 2 * t, .25, t), coping), x, .12, z - d / 2 - t / 2);
  add(new THREE.Mesh(new THREE.BoxGeometry(w + 2 * t, .25, t), coping), x, .12, z + d / 2 + t / 2);
  add(new THREE.Mesh(new THREE.BoxGeometry(t, .25, d), coping), x - w / 2 - t / 2, .12, z);
  add(new THREE.Mesh(new THREE.BoxGeometry(t, .25, d), coping), x + w / 2 + t / 2, .12, z);
  return { x, z, w, d };
}
const PA = pool(0, 14, 14, 12), PB = pool(18, -8, 12, 12), PC = pool(-20, 4, 12, 12);
// golfslagbad: eigen geometrie die op de maat golft
const WP = { x: 24, z: 24, w: 18, d: 14 };
const waveGeo = new THREE.PlaneGeometry(WP.w, WP.d, 48, 36).rotateX(-Math.PI / 2);
add(new THREE.Mesh(waveGeo, waterMat), WP.x, 0.05, WP.z, false);
pool(WP.x, WP.z, WP.w, WP.d).x;
function waveH(x, z, b) {
  const s = secAt(b)[3];
  const amp = { intro: .05, verse: .12, build: .15, drop: .38, break: .06, drop2: .55, outro: .2 }[s];
  const zz = (z - (WP.z - WP.d / 2)) / WP.d;            // 0 aan de diepe kant
  return amp * Math.sin(zz * 9 - b * Math.PI * 2) * (0.5 + zz * 0.6) + .04 * Math.sin(x * .9 + b * 3);
}
// ophaalbrug (scharnier aan de buitenoever) + entreeboog
const bridge = new THREE.Group(); bridge.position.set(-10, .45, 56.6); scene.add(bridge);
{
  const wood = std('#c9a36b'), deck = new THREE.Mesh(new THREE.BoxGeometry(4.6, .35, 11), wood);
  deck.position.z = -5.5; bridge.add(deck);
  for (const sx of [-1, 1]) { const r = new THREE.Mesh(new THREE.BoxGeometry(.15, .9, 11), wood); r.position.set(sx * 2.2, .6, -5.5); bridge.add(r); }
  bridge.traverse(m => { if (m.isMesh) m.castShadow = m.receiveShadow = true; });
  for (const sx of [-1, 1]) add(new THREE.Mesh(new THREE.BoxGeometry(.9, 5, .9), std('#8a5a3a')), -10 + sx * 2.9, 2.5, 57.2);
  add(new THREE.Mesh(new THREE.BoxGeometry(6.7, .6, .9), std('#8a5a3a')), -10, 5.2, 57.2);
}
const BRIDGE_A = Math.atan2(51, -10);              // hoek op de rivier waar de brug ligt
function bridgeAngle(b) {
  if (b < 55 || b >= 64) return 0;
  if (b >= 63) return 1.2 * (1 - smooth(b - 63));
  let a = 1.2 * smooth(b - 55);                    // gaat open in maat 56, staat open óp de 1 van maat 57 (congas terug)
  if (b >= 56) { const dt = (b - 56) * BAR; a += .08 * Math.exp(-dt * 5) * Math.sin(dt * 28); }
  return a;
}
const archMat = std('#ff5f8f');
add(new THREE.Mesh(new THREE.BoxGeometry(.7, 7, .7), archMat), -13, 3.5, 46.5);
add(new THREE.Mesh(new THREE.BoxGeometry(.7, 7, .7), archMat), -7, 3.5, 46.5);
add(new THREE.Mesh(new THREE.BoxGeometry(8, 1.4, .8), std('#ffd23b')), -10, 7.3, 46.5);

/* ---- toren met wenteltrap */
const TW = new V(0, 0, -30), TOP = 22;
add(new THREE.Mesh(new THREE.BoxGeometry(6, TOP, 6), std('#e8e2d4')), 0, TOP / 2, -30);
add(new THREE.Mesh(new THREE.BoxGeometry(7.4, .5, 7.4), std('#ffffff')), 0, TOP - .25, -30);
// het "dak": een reuzenemmer op een as, die in de outro kantelt
const AXLE_Y = TOP + 6.5;
// A-bokken: poten op de hoeken van het platform, zodat de ingangen (midden van elke zijde) vrij blijven
{
  const legM = std('#7a7f88'), dz = 3.1, H = AXLE_Y - TOP, len = Math.hypot(H, dz) + .3, tilt = Math.atan2(dz, H);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = add(new THREE.Mesh(new THREE.BoxGeometry(.4, len, .4), legM), sx * 3.75, TOP + H / 2, -30 + sz * dz / 2);
    leg.rotation.x = -sz * tilt;
  }
}
add(new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, 8.4).rotateZ(Math.PI / 2), std('#555')), 0, AXLE_Y, -30);
const bucket = new THREE.Group(); bucket.position.set(0, AXLE_Y, -30); scene.add(bucket);
{
  const bm = std('#ffa41c', { side: THREE.DoubleSide, roughness: .45 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 2.6, 3.6, 36, 1, true), bm); body.position.y = .5;
  const bottom = new THREE.Mesh(new THREE.CircleGeometry(2.6, 36).rotateX(Math.PI / 2), bm); bottom.position.y = -1.3;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(3.4, .16, 8, 36).rotateX(Math.PI / 2), std('#ffffff')); rim.position.y = 2.3;
  for (const m of [body, bottom, rim]) { m.castShadow = true; bucket.add(m); }
}
const bucketWater = new THREE.Mesh(new THREE.CircleGeometry(3.15, 36).rotateX(-Math.PI / 2), std('#2fc4e6', { roughness: .08 }));
bucketWater.position.y = 1.9; bucket.add(bucketWater);
const bucketLip = new THREE.Object3D(); bucketLip.position.set(0, 2.3, 3.2); bucket.add(bucketLip);
const HELIX = { r: 4.8, th0: Math.PI / 2, turns: 2.5 };   // eindigt aan de achterkant, vrij van de glijbanen
const STEPS = 64, stepTop = k => (k + .5) / STEPS * TOP + .01;
{
  const stepMat = std('#d0c8b6');
  for (let k = 0; k < STEPS; k++) {
    const th = HELIX.th0 + (k / STEPS) * HELIX.turns * Math.PI * 2;
    const m = add(new THREE.Mesh(new THREE.BoxGeometry(3.4, .22, 1.2), stepMat),
      Math.cos(th) * 4.75, stepTop(k) - .11, -30 + Math.sin(th) * 4.75);
    m.rotation.y = -th;
  }
}
// Positie op de trap: hoek loopt door, hoogte = de tree onder de voeten (met een opstapje ertussen).
// 64 treden in 8 maten = 2 treden per tel -> elke voetzet valt op een achtste noot.
function helixPos(u) {
  const th = HELIX.th0 + u * HELIX.turns * Math.PI * 2, kf = u * STEPS, k = Math.floor(kf), fr = kf - k;
  const lv = j => (j >= STEPS ? TOP : stepTop(j));
  const y = u >= 1 ? TOP : lerp(lv(k), lv(k + 1), smooth((fr - .3) / .4));
  return new V(Math.cos(th) * HELIX.r, y, -30 + Math.sin(th) * HELIX.r);
}

/* ---- glijbanen: halfpipe / tube langs een curve */
function sweep(curve, R, full, mat, u0 = 0, segs = 500, rad = 20) {
  const pos = [], idx = [], arc = full ? Math.PI * 2 : Math.PI;
  for (let i = 0; i <= segs; i++) {
    const f = frame(curve, u0 + (1 - u0) * i / segs);
    for (let j = 0; j <= rad; j++) {
      const a = j / rad * arc;
      const d = new V().addScaledVector(f.side, Math.cos(a)).addScaledVector(f.n, -Math.sin(a));
      pos.push(f.P.x + d.x * R, f.P.y + d.y * R, f.P.z + d.z * R);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < rad; j++) {
    const a = i * (rad + 1) + j, c = a + rad + 1; idx.push(a, c, a + 1, c, c + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; scene.add(m);
  return m;
}
// Steunpalen: raycast van onderen tegen alle banen. Zit er een andere baan of lagere winding
// tussen, dan geen paal. De bovenkant wordt per vertex tegen het baanoppervlak geschoven, zodat
// de paal schuin/rond afgesneden precies op de onderkant van de baan aansluit.
function pillars(curve, mesh, all) {
  const L = curve.getLength(), pm = std('#9aa0a8'), ray = new THREE.Raycaster();
  const surfaceY = (x, z, far) => { ray.set(new V(x, -1, z), UP); ray.far = far; const q = ray.intersectObject(mesh, false)[0]; return q && q.point.y; };
  for (let s = 2; s < L; s += 3.2) {
    const P = curve.getPointAt(s / L);
    if (P.y - R < 1.2 || Math.hypot(P.x, P.z + 30) < 7.8) continue;     // niet door de wenteltrap
    ray.set(new V(P.x, -1, P.z), UP); ray.far = P.y + 2;
    const hit = ray.intersectObjects(all, false)[0];
    if (!hit || hit.object !== mesh || hit.point.y < P.y - R * 2.5) continue;
    const g = new THREE.CylinderGeometry(.12, .12, 1, 12, 1).translate(0, .5, 0), pa = g.attributes.position;
    for (let k = 0; k < pa.count; k++) {
      if (pa.getY(k) < .5) continue;
      const y = surfaceY(P.x + pa.getX(k), P.z + pa.getZ(k), P.y + 2);
      pa.setY(k, (y != null ? y : hit.point.y) - .005);
    }
    g.computeVertexNormals();
    add(new THREE.Mesh(g, pm), P.x, 0, P.z);
  }
}
function frame(curve, u) {
  u = clamp(u, 0, 1);
  const P = curve.getPointAt(u), T = curve.getTangentAt(u);
  const side = new V().crossVectors(T, UP).normalize();
  const n = new V().crossVectors(side, T).normalize();
  return { P, T, n, side };
}
const basisQuat = (T, n) => new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(new V().crossVectors(n, T).normalize(), n, T));
const cr = pts => new THREE.CatmullRomCurve3(pts, false, 'centripetal');
const R = 1.1, H0 = TOP + R;
const SL = [];
// Ingangen precies op de rand van het platform (halve breedte 3.7), bodem gelijk met de vloer.
// Uitgangen hangen ~0.6 m boven het water: je plonst erin, de buis duikt nergens de grond in.
const EDGE = 3.8;
// A: rode kamikaze, recht en steil naar het spetterbad
SL.push({ R, curve: cr([new V(0, H0, -30 + EDGE), new V(0, H0, -30 + EDGE + 1.5), new V(0, H0 - .7, -23.3), new V(0, 17, -17), new V(0, 8.5, -7),
  new V(0, 3.2, 1.5), new V(0, 1.9, 6.5), new V(0, 1.7, 10.5)]), ease: s => s * s * .75 + s * .25 });
// B: gele tube, spiraal
{
  const pts = [new V(EDGE, H0, -30), new V(EDGE + 1.5, H0, -30), new V(7.6, H0 - .8, -30.4)], c = new V(14.6, 0, -30), r = 6;
  const th0 = Math.PI, th1 = Math.PI / 2 - Math.PI * 4, n = 40;
  for (let k = 1; k <= n; k++) { const u = k / n, th = lerp(th0, th1, u); pts.push(new V(c.x + Math.cos(th) * r, lerp(H0 - 1.5, 3.4, u), c.z + Math.sin(th) * r)); }
  pts.push(new V(17, 2.6, -20.5), new V(18, 2, -15), new V(18, 1.8, -10));
  SL.push({ R, curve: cr(pts), full: true, ease: s => s * s * .3 + s * .7 });
}
// C: blauwe slingerbaan
{
  const pts = [new V(-EDGE, H0, -30), new V(-EDGE - 1.5, H0, -30), new V(-8, H0 - .9, -29.6)];
  for (let k = 1; k <= 30; k++) { const s = k / 30; pts.push(new V(-8 - 12 * s + Math.sin(s * Math.PI * 3.5) * 4.5 * smooth(s / .25) * (1 - s * .5), (H0 - 1.6) * (1 - s) ** 1.25 + 1.8, -29.6 + 31.6 * s)); }
  pts.push(new V(-20, 1.8, 5));
  SL.push({ R, curve: cr(pts), ease: s => s * s * .5 + s * .5 });

  // spetters: posities uit de instanced mesh
  const drp = [], m4 = new THREE.Matrix4(), p = new V(), qq = new THREE.Quaternion(), sc = new V();
  for (let k = 0; k < NP; k++) { drops.getMatrixAt(k, m4); m4.decompose(p, qq, sc); if (sc.x > 1e-3) drp.push([+p.x.toFixed(3), +p.y.toFixed(3), +p.z.toFixed(3), +(sc.x * .13).toFixed(3)]); }
  const hidden = [sky, drops, ...clouds].filter(o => o.visible); hidden.forEach(o => o.visible = false);
  const renamed = [];
  scene.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const mt = o.material, hex = mt.color ? mt.color.getHexString() : '';
    renamed.push([mt, mt.name]);
    if (figSet.has(o)) mt.name = hex === '1d1d22' ? 'fig_ink' : 'fig_' + hex;
    else mt.name = (hex === 'ffd23b') ? (mt.transparent ? 'slide_yellow' : 'plastic_yellow') : (KIND[hex] || 'misc_' + hex);
  });
  const glb = await new GLTFExporter().parseAsync(scene, { binary: true, onlyVisible: true });
  hidden.forEach(o => o.visible = true); renamed.forEach(([mt, n]) => mt.name = n);
  const sd = sun.position.clone().normalize();
  const meta = { bar: bb, t, cam: { pos: camera.position.toArray(), quat: camera.quaternion.toArray(), fov: camera.fov },
    sun: { dir: sd.toArray(), color: sun.color.toArray(), intensity: sun.intensity }, sky: { top: skyMat.uniforms.top.value.toArray(), bot: skyMat.uniforms.bot.value.toArray(),
      sunDir: skyMat.uniforms.sunDir.value.toArray() }, drops: drp };
  await saveData(name + '.glb', new Blob([glb]));
  await saveData(name + '.json', JSON.stringify(meta));
  return { name, drops: drp.length, kb: Math.round(glb.byteLength / 1024) };
};
window.__progress = 0;
window.__renderVideo = async (fps = 30, t0 = 0, t1 = DUR) => {
  const c2 = document.createElement('canvas'); c2.width = VW; c2.height = VH;
  const g = c2.getContext('2d'), N = Math.ceil((t1 - t0) * fps);
  await fetch(`/start?fps=${fps}&t0=${t0}&t1=${t1}`, { method: 'POST' });
  for (let i = 0; i < N; i++) {
    renderAt(t0 + i / fps);
    g.drawImage(renderer.domElement, 0, 0);                    // direct na render: buffer nog geldig
    if (OVER.flash > 0) { g.fillStyle = `rgba(255,255,255,${OVER.flash})`; g.fillRect(0, 0, VW, VH); }
    if (OVER.fade > 0) { g.fillStyle = `rgba(0,0,0,${OVER.fade})`; g.fillRect(0, 0, VW, VH); }
    const blob = await new Promise(r => c2.toBlob(r, 'image/jpeg', .95));
    await fetch('/frame', { method: 'POST', body: blob });
    window.__progress = (i + 1) / N;
  }
  await fetch('/end', { method: 'POST' });
  return 'klaar';
};
if (RENDER) for (const id of ['hud', 'bar', 'start', 'flash', 'fade']) document.getElementById(id).classList.add('hidden');

function loop(ms) {
  if (RENDER) return;                                          // export stuurt zelf de frames
  requestAnimationFrame(loop);
  if (lastNow) fps = lerp(fps, 1000 / Math.max(1, ms - lastNow), .05); lastNow = ms;
  renderAt(now());
}
requestAnimationFrame(loop);
</script>
